name: C++ quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dsa-cpp-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check C++ sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) -not -path './.git/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No C++ source files found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only "$file"
          done
